# Check that the JSON examples embedded in the spec all use the same
# formatting, so that a diff to an example shows what changed about the
# example rather than how it was reflowed.
#
# See <https://github.com/w3c-ccg/zcap-spec/issues/105> for the rules and
# lib/zcap-spec-example-format/README.md for the checker itself. This workflow
# never runs the checker's --fix: CI reports, a human applies.
name: Check example formatting

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The checker has no dependencies, so there is nothing to install
      # between checkout and running it.
      - name: Test the checker
        working-directory: lib/zcap-spec-example-format
        run: node --test test.mjs

      - name: Check the examples in index.html
        run: node lib/zcap-spec-example-format/check-examples.mjs index.html
